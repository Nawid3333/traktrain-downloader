# Runs the offline test suite on every push and pull request. release.yml
# runs the same suite, but only once a release is published -- by then a
# broken commit is already on main and tagged. This is the same check,
# moved earlier.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # runner-images.yml runs this on a new runner image, before and after
  # windows-latest moves to it.
  workflow_call:
    inputs:
      # No Linux job here; accepted so that every repository's CI takes the same inputs.
      linux-runner:
        type: string
        default: ubuntu-latest
      windows-runner:
        type: string
        default: windows-latest

permissions:
  contents: read

jobs:
  test:
    # Matches release.yml: windows-latest is the only platform this tool has
    # been run on, so keeping CI on the same runner means a green CI run
    # actually predicts a green release build.
    runs-on: ${{ inputs.windows-runner || 'windows-latest' }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The floor declared in requires-python, as in release.yml: testing
          # the oldest supported version is what catches a newer-only API
          # slipping in.
          python-version: "3.10"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ".[dev]"

      - name: Lint
        run: python -m ruff check .

      - name: Format
        run: python -m ruff format --check .

      - name: Type check
        run: python -m pyright

      - name: Test
        # The suite is offline by design: it never touches traktrain.com.
        # trakGrab.py must stay at 100% coverage -- the report prints the
        # table, and fail-under turns any regression into a red run.
        run: python -m pytest --cov trakGrab --cov-report=term-missing --cov-fail-under=100
